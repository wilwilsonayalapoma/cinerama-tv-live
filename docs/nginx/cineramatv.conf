server {
    server_name cineramatvbo.com www.cineramatvbo.com;

    root /var/www/cineramatv;
    index index.html index.htm;

    access_log /var/log/nginx/cineramatv_access.log;
    error_log /var/log/nginx/cineramatv_error.log;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|mp4|webm)$ {
        valid_referers none blocked server_names *.cineramatvbo.com localhost 127.0.0.1;
        if ($invalid_referer) {
            return 403;
        }

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
        access_log off;
    }

    # El contenido HLS en vivo nunca debe almacenarse en la caché del navegador.
    location /hls/ {
        proxy_pass http://127.0.0.1:8080/hls/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;

        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cineramatvbo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cineramatvbo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name tv.cineramatvbo.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cineramatvbo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cineramatvbo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name cineramatvbo.com www.cineramatvbo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name tv.cineramatvbo.com;
    return 301 https://$host$request_uri;
}
